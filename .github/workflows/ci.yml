name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned together: the SQL test runner and the metadata checker must speak the
  # same VGI protocol as the SDK. Template updates bump these (make template-diff).
  HAYBARN_VERSION: "2.0.1rc3"
  # Pure Go. Importing vgi-go/vgi/exprduckdb (for Evaluate/AutoApplyFilters) needs cgo.
  CGO_ENABLED: "0"

jobs:
  quality:
    name: Lint + unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make lint
      - run: make test-unit

  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on private repos; add macos-latest here when you need it.
        os: [ubuntu-latest, windows-latest]
        transport: [stdio, launch, http]
        exclude:
          - os: windows-latest
            transport: launch   # the launcher uses AF_UNIX sockets
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Build the worker and the recipes
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=.exe
          go build -o "bin/vgi-nats-worker$exe" ./cmd/vgi-nats-worker
          go build -o "bin/recipes$exe" ./examples
          go build -o "bin/natsfixture$exe" ./test/fixture/natsfixture
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then tools="$PWD/.tools/Scripts"; exe=.exe
          else tools="$PWD/.tools/bin"; exe=""; fi
          export WORKER="$PWD/bin/vgi-nats-worker$exe"
          export HAYBARN_UNITTEST="$tools/haybarn-unittest$exe"
          export RECIPES_WORKER="$PWD/bin/recipes$exe"
          # The NATS fixture is an embedded nats-server (no Docker), started by the harness.
          export FIXTURE="$PWD/bin/natsfixture$exe"
          TRANSPORT=${{ matrix.transport }} PYTHON="uv run --no-project python" ci/run-integration.sh

  metadata:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/vgi-nats-worker ./cmd/vgi-nats-worker
      - name: Read fail_on from vgi-lint.toml
        id: lintcfg
        run: python3 -c 'import tomllib; print("fail_on=" + tomllib.load(open("vgi-lint.toml", "rb")).get("fail_on", "error"))' >> "$GITHUB_OUTPUT"
      - uses: Query-farm/vgi-lint-check@v2
        with:
          location: ${{ github.workspace }}/bin/vgi-nats-worker
          # Set in vgi-lint.toml, so local runs and CI agree.
          fail-on: ${{ steps.lintcfg.outputs.fail_on }}
          # Credential-gated: every table function (nats.main.server_info, connections,
          # streams, consumers, messages, kv_entries, objects, ...) needs a `nats` secret
          # (SERVERS plus a token, user/password, NKey seed or .creds) for a live NATS
          # server, and the monitoring functions also need MONITORING_URL or
          # system-account credentials, so examples are not executed here. The SQL
          # tests run every function against the embedded fixture instead.
          execute: "false"

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t worker:ci .
      - name: HTTP /health
        run: |
          docker run -d --name smoke -p 8000:8000 worker:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs smoke; exit 1
